<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Twin Life Simulator</title>
    <style>
        :root {
            --bg-color: #0f111a;
            --panel-bg: #1a1d2d;
            --accent-primary: #00f0ff;
            --accent-secondary: #ff003c;
            --text-main: #e0e6ed;
            --text-muted: #8b949e;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .header {
            grid-column: 1 / -1;
            text-align: center;
            border-bottom: 2px solid var(--accent-primary);
            padding-bottom: 20px;
            margin-bottom: 10px;
        }

        .header h1 {
            margin: 0;
            font-weight: 300;
            letter-spacing: 2px;
            color: var(--accent-primary);
            text-transform: uppercase;
        }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid #2d334a;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        h2 {
            margin-top: 0;
            font-size: 1.2rem;
            color: var(--text-main);
            border-left: 4px solid var(--accent-primary);
            padding-left: 10px;
        }

        /* Progress Bars */
        .domain-row {
            margin-bottom: 15px;
        }

        .domain-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .bar-bg {
            background-color: #000;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #333;
        }

        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #0055ff, var(--accent-primary));
            width: 50%;
            transition: width 0.5s ease-in-out;
        }

        /* Buttons & Inputs */
        button {
            background-color: transparent;
            color: var(--accent-primary);
            border: 1px solid var(--accent-primary);
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            transition: all 0.2s;
            width: 100%;
            margin-bottom: 10px;
        }

        button:hover {
            background-color: var(--accent-primary);
            color: #000;
            box-shadow: 0 0 10px var(--accent-primary);
        }

        button.simulate-btn {
            background-color: var(--accent-primary);
            color: #000;
            font-size: 1.1rem;
            padding: 15px;
            margin-top: 20px;
        }

        button.simulate-btn:hover {
            box-shadow: 0 0 20px var(--accent-primary);
        }

        .decision-btn {
            border-color: var(--text-muted);
            color: var(--text-main);
            text-align: left;
            font-size: 0.85rem;
        }

        .decision-btn:hover {
            border-color: var(--accent-secondary);
            background-color: rgba(255, 0, 60, 0.1);
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 0, 60, 0.3);
        }

        /* Log */
        .log-box {
            background-color: #0a0c13;
            border: 1px solid #222;
            height: 150px;
            overflow-y: auto;
            padding: 10px;
            font-family: monospace;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .log-entry { margin-bottom: 5px; }
        .log-entry.positive { color: #00ff88; }
        .log-entry.negative { color: var(--accent-secondary); }

        .wellbeing {
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
            color: #fff;
            margin-bottom: 20px;
            text-shadow: 0 0 10px var(--accent-primary);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Digital Twin Simulator</h1>
        <p style="color: var(--text-muted);">Personal Decision Engine | OOP Port</p>
    </div>

    <!-- Left Column: Dashboard & Logs -->
    <div class="panel">
        <h2>Life Domains</h2>
        <div class="wellbeing" id="wellbeing-display">WBI: 50.0</div>
        
        <div id="domains-container">
            <!-- Bars injected by JS -->
        </div>

        <button class="simulate-btn" onclick="simulateDays(30)">Run 30-Day Simulation</button>

        <h2 style="margin-top: 20px;">Event Log</h2>
        <div class="log-box" id="log-box">
            <div class="log-entry">System initialized. Twin loaded.</div>
        </div>
    </div>

    <!-- Right Column: Decisions -->
    <div class="panel">
        <h2>Life Decisions</h2>
        <p style="font-size: 0.85rem; color: var(--text-muted);">Apply major life events to see instant trade-offs.</p>
        
        <button class="decision-btn" onclick="applyDecision('Side Business', {Career: 15, Financial: 12, Mental: -8, Social: -5})">
            <strong>Start a Side Business</strong><br>
            <span style="color: #00ff88;">+ Career, Financial</span> | <span style="color: var(--accent-secondary);">- Mental, Social</span>
        </button>

        <button class="decision-btn" onclick="applyDecision('Healthier Diet', {Health: 18, Mental: 8, Social: -3})">
            <strong>Switch to Healthier Diet</strong><br>
            <span style="color: #00ff88;">+ Health, Mental</span> | <span style="color: var(--accent-secondary);">- Social</span>
        </button>

        <button class="decision-btn" onclick="applyDecision('Higher Education', {Career: 20, Mental: 5, Financial: -10, Social: -6})">
            <strong>Pursue Higher Education</strong><br>
            <span style="color: #00ff88;">+ Career, Mental</span> | <span style="color: var(--accent-secondary);">- Financial, Social</span>
        </button>

        <button class="decision-btn" onclick="applyDecision('Daily Meditation', {Mental: 20, Creativity: 10, Health: 8})">
            <strong>Adopt Daily Meditation</strong><br>
            <span style="color: #00ff88;">+ Mental, Creativity, Health</span>
        </button>

        <button class="decision-btn" onclick="applyDecision('Relocate', {Career: 18, Mental: 5, Financial: -15, Social: -12})">
            <strong>Relocate to a New City</strong><br>
            <span style="color: #00ff88;">+ Career, Mental</span> | <span style="color: var(--accent-secondary);">- Financial, Social</span>
        </button>
    </div>
</div>

<script>
    // State Management (Replicating C++ Class Logic)
    let domains = {
        Health: 50,
        Career: 50,
        Mental: 50,
        Social: 50,
        Financial: 50,
        Creativity: 50
    };

    function updateDashboard() {
        const container = document.getElementById('domains-container');
        container.innerHTML = '';
        
        let total = 0;

        for (const [name, score] of Object.entries(domains)) {
            // Clamp scores between 0 and 100
            domains[name] = Math.max(0, Math.min(100, score));
            total += domains[name];

            const safeScore = domains[name].toFixed(1);
            
            container.innerHTML += `
                <div class="domain-row">
                    <div class="domain-label">
                        <span>${name}</span>
                        <span>${safeScore} / 100</span>
                    </div>
                    <div class="bar-bg">
                        <div class="bar-fill" style="width: ${safeScore}%;"></div>
                    </div>
                </div>
            `;
        }

        const wbi = (total / 6).toFixed(1);
        document.getElementById('wellbeing-display').innerText = `WBI: ${wbi}`;
    }

    function logEvent(message, type = 'neutral') {
        const logBox = document.getElementById('log-box');
        logBox.innerHTML += `<div class="log-entry ${type}">> ${message}</div>`;
        logBox.scrollTop = logBox.scrollHeight;
    }

    function simulateDays(days) {
        // Simulating the compounding effect of habits over time
        domains.Health += 3.5;
        domains.Mental += 2.0;
        domains.Career += 1.5;
        domains.Creativity += 1.0;
        
        logEvent(`Simulated ${days} days of routine. Domains updated.`, 'positive');
        updateDashboard();
    }

    function applyDecision(title, impacts) {
        let impactStr = '';
        for (const [domain, delta] of Object.entries(impacts)) {
            domains[domain] += delta;
            impactStr += `${domain} ${delta > 0 ? '+' : ''}${delta} `;
        }
        
        logEvent(`Decision Applied: ${title}`, 'neutral');
        logEvent(`Impacts: ${impactStr}`, deltaType(impacts));
        updateDashboard();
    }

    function deltaType(impacts) {
        const net = Object.values(impacts).reduce((a, b) => a + b, 0);
        return net >= 0 ? 'positive' : 'negative';
    }

    // Initialize
    updateDashboard();
</script>

</body>
</html>
